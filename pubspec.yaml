name: gifting
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  supabase_flutter: ^2.18.3
  intl: ^0.20.3
  url_launcher: ^6.3.3
  csv: ^8.0.0
  cached_network_image: ^4.0.5
  path_provider: ^2.1.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  paginated_list: ^1.2.3
  flutter_animate: ^4.5.2
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner:
  hive_generator:
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icons/logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icons/logo.png"

flutter_native_splash:
  image: "assets/icons/logo.png"
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  android: true
  ios: true
  web: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/gif/

