name: Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Create environment configuration
        env:
          FIREBASE_OPTIONS: ${{ secrets.FIREBASE_OPTIONS_DART }}
          AI_KEY: ${{ secrets.AI_KEY }}
          RAZORPAY_KEY: ${{ secrets.RAZORPAY_KEY }}
        run: |
          if [ -z "$FIREBASE_OPTIONS" ]; then
            echo "Firebase options secret missing"
            exit 1
          fi

          printf '%s' "$FIREBASE_OPTIONS" > lib/firebase_options.dart

          cat > .env <<EOF
          AI_KEY=$AI_KEY
          RAZORPAY_KEY=$RAZORPAY_KEY
          EOF

      - name: Build Flutter Web
        run: |
          flutter build web \
            --release \
            --base-href /gifting/ \
            --dart-define-from-file=keys.env

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
